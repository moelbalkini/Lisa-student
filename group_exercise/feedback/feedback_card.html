<style>
 :root{--bg:#FAF8F4;--surface:#fff;--ink:#1C1B29;--muted:#6A6879;--line:#E4E0D8;--accent:#5B4B8A;--teal:#2F7E7E}
 @media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#131220;--surface:#1C1B2B;--ink:#ECEAF4;--muted:#A5A2B8;--line:#302E44;--accent:#A594E0;--teal:#5FB4B0}}

 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:6vmin}
 .card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:7vmin 7vmin 6vmin;max-width:620px;width:100%;text-align:center;box-shadow:0 30px 70px -30px rgba(28,27,41,.35)}
 .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin:0 0 14px}
 h1{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:clamp(30px,6vmin,46px);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
 p.lead{color:var(--muted);font-size:clamp(15px,2.4vmin,18px);margin:14px auto 0;max-width:34ch}
 .qr{width:min(58vmin,340px);height:min(58vmin,340px);margin:6vmin auto 4vmin;padding:20px;background:#fff;border:1px solid var(--line);border-radius:18px}
 .cta{font-weight:600;font-size:clamp(17px,3vmin,22px);margin:0}
 .url{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--muted);margin:10px 0 0;word-break:break-all}
 .foot{margin:5vmin 0 0;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}
 @media print{body{background:#fff;padding:0}.card{border:none;box-shadow:none}}
</style>
